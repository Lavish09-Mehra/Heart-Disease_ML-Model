<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Disease Risk Predictor</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --muted: #94a3b8;
      --text: #e2e8f0;
      --accent: #38bdf8;
      --danger: #f87171;
      --ok: #4ade80;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1e3a5f 0%, var(--bg) 55%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .wrap { width: 100%; max-width: 860px; }
    header { margin-bottom: 20px; }
    header h1 { margin: 0 0 6px; font-size: 1.6rem; }
    header p { margin: 0; color: var(--muted); font-size: .95rem; }
    .card {
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
      backdrop-filter: blur(6px);
    }
    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 18px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: .82rem; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-size: .95rem;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.15); }
    .actions { grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 6px; }
    button {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      color: #04121f;
      transition: transform .05s ease, filter .15s ease;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 600;
    }
    .result {
      grid-column: 1 / -1;
      margin-top: 10px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0b1220;
      display: none;
    }
    .result.show { display: block; }
    .result .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .result .label { font-size: .85rem; color: var(--muted); }
    .result .value { font-size: 1.5rem; font-weight: 800; }
    .bar { height: 10px; border-radius: 999px; background: #1e293b; margin-top: 10px; overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 0%; border-radius: 999px; transition: width .5s ease; }
    .risk-high { color: var(--danger); }
    .risk-low { color: var(--ok); }
    .fill-high { background: linear-gradient(90deg, #fb7185, #ef4444); }
    .fill-low { background: linear-gradient(90deg, #34d399, #22c55e); }
    .err { color: var(--danger); font-size: .9rem; margin-top: 8px; }
    .note { margin-top: 14px; font-size: .78rem; color: var(--muted); }
    @media (max-width: 620px) { form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Heart Disease Risk Predictor</h1>
      <p>Logistic Regression model &middot; fills a patient record and returns the estimated risk.</p>
    </header>

    <div class="card">
      <form id="form">
        <div class="field">
          <label for="Age">Age (years)</label>
          <input id="Age" name="Age" type="number" min="18" max="120" step="1" value="54" required />
        </div>
        <div class="field">
          <label for="Sex">Sex</label>
          <select id="Sex" name="Sex">
            <option value="M">M</option>
            <option value="F">F</option>
          </select>
        </div>
        <div class="field">
          <label for="ChestPainType">Chest pain type</label>
          <select id="ChestPainType" name="ChestPainType">
            <option value="ASY">ASY</option>
            <option value="ATA">ATA</option>
            <option value="NAP">NAP</option>
            <option value="TA">TA</option>
          </select>
        </div>
        <div class="field">
          <label for="RestingBP">Resting blood pressure (mm Hg)</label>
          <input id="RestingBP" name="RestingBP" type="number" min="0" max="300" step="1" value="130" required />
        </div>
        <div class="field">
          <label for="Cholesterol">Cholesterol (mg/dl)</label>
          <input id="Cholesterol" name="Cholesterol" type="number" min="0" max="1000" step="1" value="240" required />
        </div>
        <div class="field">
          <label for="FastingBS">Fasting blood sugar &gt; 120 mg/dl</label>
          <select id="FastingBS" name="FastingBS">
            <option value="0">No (0)</option>
            <option value="1">Yes (1)</option>
          </select>
        </div>
        <div class="field">
          <label for="RestingECG">Resting ECG</label>
          <select id="RestingECG" name="RestingECG">
            <option value="Normal">Normal</option>
            <option value="ST">ST</option>
            <option value="LVH">LVH</option>
          </select>
        </div>
        <div class="field">
          <label for="MaxHR">Max heart rate</label>
          <input id="MaxHR" name="MaxHR" type="number" min="0" max="300" step="1" value="140" required />
        </div>
        <div class="field">
          <label for="ExerciseAngina">Exercise-induced angina</label>
          <select id="ExerciseAngina" name="ExerciseAngina">
            <option value="N">No (N)</option>
            <option value="Y">Yes (Y)</option>
          </select>
        </div>
        <div class="field">
          <label for="Oldpeak">Oldpeak (ST depression)</label>
          <input id="Oldpeak" name="Oldpeak" type="number" min="-5" max="10" step="0.1" value="1.0" required />
        </div>
        <div class="field">
          <label for="ST_Slope">ST slope</label>
          <select id="ST_Slope" name="ST_Slope">
            <option value="Up">Up</option>
            <option value="Flat">Flat</option>
            <option value="Down">Down</option>
          </select>
        </div>

        <div class="actions">
          <button type="submit" id="submit">Predict risk</button>
          <button type="button" class="ghost" id="reset">Reset</button>
        </div>

        <div class="result" id="result">
          <div class="row">
            <span class="label">Estimated risk</span>
            <span class="value" id="riskValue">—</span>
          </div>
          <div class="bar"><span id="bar"></span></div>
          <div class="row" style="margin-top:10px">
            <span class="label">Model says</span>
            <span id="verdict">—</span>
          </div>
          <div class="err" id="err"></div>
        </div>
      </form>
      <p class="note">For educational use only — not medical advice.</p>
    </div>
  </div>

  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");
    const riskValue = document.getElementById("riskValue");
    const verdict = document.getElementById("verdict");
    const bar = document.getElementById("bar");
    const err = document.getElementById("err");
    const submit = document.getElementById("submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      submit.disabled = true;
      submit.textContent = "Predicting…";

      const fd = new FormData(form);
      const payload = {};
      for (const [k, v] of fd.entries()) {
        payload[k] = ["Age", "RestingBP", "Cholesterol", "MaxHR", "Oldpeak"].includes(k)
          ? Number(v)
          : k === "FastingBS" ? Number(v) : v;
      }

      try {
        const res = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : "Request failed");

        const pct = data.risk_percent;
        result.classList.add("show");
        riskValue.textContent = pct.toFixed(1) + "%";
        riskValue.className = "value " + (data.prediction === 1 ? "risk-high" : "risk-low");
        verdict.textContent = data.label;
        verdict.className = data.prediction === 1 ? "risk-high" : "risk-low";
        bar.className = data.prediction === 1 ? "fill-high" : "fill-low";
        bar.style.width = Math.max(2, Math.min(100, pct)) + "%";
      } catch (ex) {
        result.classList.add("show");
        err.textContent = "Error: " + ex.message;
        verdict.textContent = "—";
        riskValue.textContent = "—";
      } finally {
        submit.disabled = false;
        submit.textContent = "Predict risk";
      }
    });

    document.getElementById("reset").addEventListener("click", () => {
      form.reset();
      result.classList.remove("show");
      bar.style.width = "0%";
    });
  </script>
</body>
</html>
